[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hx-cli"
version = "0.1.0"
description = "Read, inspect, and safely edit Line 6 Helix .hlx preset files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Arief Samuel" }]

[project.optional-dependencies]
mcp = ["mcp>=1.2.0"]

[project.scripts]
hx = "hx_cli.cli:main"
hx-mcp = "hx_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["hx_cli", "hx_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
